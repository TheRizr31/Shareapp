<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F3E8">
<title>Partage</title>

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icone.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Partage">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap');
  body {
    background: #F7F3E8;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overscroll-behavior-y: none;
    margin: 0;
  }
  input, select, textarea { font-size: 16px; }  /* évite le zoom iOS */
  @keyframes monte { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .monte { animation: monte .28s cubic-bezier(.2,.7,.3,1) both; }
  @media (prefers-reduced-motion: reduce) { .monte { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

/* =====================================================================
 *  Vérification du déploiement
 *
 *  Cette page confirme que la base et l'API fonctionnent.
 *  Une fois les contrôles au vert, elle sera remplacée par
 *  l'application complète.
 * ===================================================================== */

const appeler = async (action, corps = {}) => {
  const r = await fetch(`/api/${action}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(corps),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erreur || `Erreur ${r.status}`);
  return d;
};

const SIGNES = { ok: "✓", ko: "✕", cours: "⟳" };

function Verification() {
  const [tests, setTests] = useState([]);
  const [jeton, setJeton] = useState(null);
  const [enCours, setEnCours] = useState(false);
  const [installable, setInstallable] = useState(null);

  useEffect(() => {
    const h = (e) => { e.preventDefault(); setInstallable(e); };
    window.addEventListener("beforeinstallprompt", h);
    return () => window.removeEventListener("beforeinstallprompt", h);
  }, []);

  const lancer = async () => {
    setEnCours(true);
    const liste = [];
    const noter = (nom, etat, detail = "") => {
      liste.push({ nom, etat, detail });
      setTests([...liste]);
    };

    // 1 — l'API répond
    try {
      const r = await fetch("/api/lire", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jeton: "inexistant00" }),
      });
      if (r.status === 500) {
        noter("L'API répond", "ko", "erreur 500 — la base n'est pas liée au projet");
        setEnCours(false);
        return;
      }
      noter("L'API répond", "ok", `statut ${r.status}`);
    } catch (e) {
      noter("L'API répond", "ko", "les Functions ne sont pas déployées");
      setEnCours(false);
      return;
    }

    // 2 — création
    let j;
    try {
      const res = await appeler("creer", { type: "addition", titre: "Test" });
      j = res.jeton;
      setJeton(j);
      noter("Création d'une session", "ok", `jeton ${j}`);
    } catch (e) {
      noter("Création d'une session", "ko", `${e.message} — tables absentes ?`);
      setEnCours(false);
      return;
    }

    // 3 — écriture
    try {
      const marc = await appeler("ajouter-participant", { jeton: j, nom: "Marc", couleur: "#C1362F" });
      const lea = await appeler("ajouter-participant", { jeton: j, nom: "Léa", couleur: "#2E6F5E" });
      await appeler("ajouter-article", {
        jeton: j, libelle: "Bouteille", montant: 3200, quantite: 1,
        parts: [
          { participantId: marc.id, numerateur: 1, denominateur: 3 },
          { participantId: lea.id, numerateur: 2, denominateur: 3 },
        ],
      });
      noter("Écriture", "ok", "2 personnes, 1 article");
    } catch (e) {
      noter("Écriture", "ko", e.message);
      setEnCours(false);
      return;
    }

    // 4 — relecture et fractions
    try {
      const s = await appeler("lire", { jeton: j });
      const a = s.articles[0];
      const fr = a.parts.map((p) => `${p.numerateur}/${p.denominateur}`).sort();
      const bon = s.participants.length === 2 && a.montant === 3200 &&
                  JSON.stringify(fr) === JSON.stringify(["1/3", "2/3"]);
      noter("Relecture et fractions", bon ? "ok" : "ko",
            `${a.libelle} ${(a.montant / 100).toFixed(2)} € · ${fr.join(" + ")}`);
    } catch (e) {
      noter("Relecture", "ko", e.message);
    }

    // 5 — protection
    try {
      await appeler("lire", { jeton: "zzzzzzzzzzzz" });
      noter("Protection par jeton", "ko", "un jeton invalide a été accepté");
    } catch {
      noter("Protection par jeton", "ok", "jeton invalide refusé");
    }

    // 6 — stockage local
    try {
      localStorage.setItem("partage:test", j);
      const relu = localStorage.getItem("partage:test") === j;
      localStorage.removeItem("partage:test");
      noter("Mémoire du navigateur", relu ? "ok" : "ko");
    } catch (e) {
      noter("Mémoire du navigateur", "ko", "stockage refusé (navigation privée ?)");
    }

    setEnCours(false);
  };

  const effacer = async () => {
    if (!jeton) return;
    try {
      await appeler("supprimer-session", { jeton });
      setJeton(null);
      setTests([]);
    } catch (e) { alert(e.message); }
  };

  const partager = async () => {
    const url = `${location.origin}/s/${jeton}`;
    try {
      if (navigator.share) { await navigator.share({ title: "Partage", url }); return; }
      await navigator.clipboard.writeText(url);
      alert("Lien copié");
    } catch (e) {
      if (e?.name !== "AbortError") alert("Lien : " + url);
    }
  };

  const tousOk = tests.length >= 6 && tests.every((t) => t.etat === "ok");

  return (
    <div className="min-h-screen" style={{ fontFamily: "'Archivo', system-ui, sans-serif" }}>
      <div className="mx-auto max-w-[430px] px-5 pb-16 pt-10">
        <h1 className="text-[30px] font-bold tracking-[-0.03em]">Vérification</h1>
        <p className="mt-2 text-[13.5px] leading-relaxed" style={{ color: "#8B8578" }}>
          Confirme que la base et l'API fonctionnent avant d'installer l'application.
        </p>

        <button onClick={lancer} disabled={enCours}
          className="mt-6 w-full rounded-[14px] py-3.5 text-[15px] font-semibold transition-colors"
          style={{ background: enCours ? "#E0D8C7" : "#1C1A17",
                   color: enCours ? "#B0A897" : "#F7F3E8" }}>
          {enCours ? "Vérification en cours…" : "Lancer la vérification"}
        </button>

        {tests.length > 0 && (
          <div className="mt-6 space-y-2">
            {tests.map((t, i) => (
              <div key={i} className="monte flex items-start gap-3 rounded-[14px] p-3.5"
                   style={{ background: "#fff", boxShadow: "0 0 0 1px #E9E2D2" }}>
                <span className="text-[15px] font-bold leading-tight"
                      style={{ color: t.etat === "ok" ? "#2E6F5E" : "#C1362F" }}>
                  {SIGNES[t.etat]}
                </span>
                <span className="min-w-0 flex-1">
                  <span className="block text-[14px] font-semibold">{t.nom}</span>
                  {t.detail && (
                    <span className="mt-0.5 block break-words text-[12px]"
                          style={{ color: "#8B8578", fontFamily: "'Roboto Mono', monospace" }}>
                      {t.detail}
                    </span>
                  )}
                </span>
              </div>
            ))}
          </div>
        )}

        {tousOk && (
          <div className="monte mt-5 rounded-[14px] p-4"
               style={{ background: "#E8F0EC", border: "1px solid #BFD8CE" }}>
            <p className="text-[14px] font-semibold" style={{ color: "#2E6F5E" }}>
              Tout fonctionne.
            </p>
            <p className="mt-1.5 text-[12.5px] leading-relaxed" style={{ color: "#4A7A68" }}>
              La base répond, les écritures passent et les fractions sont exactes.
              Le socle est prêt pour l'application.
            </p>
          </div>
        )}

        {jeton && (
          <div className="mt-4 flex gap-2">
            <button onClick={partager}
              className="flex-1 rounded-[12px] py-2.5 text-[13px] font-semibold"
              style={{ border: "1px solid #DDD5C4", background: "#fff" }}>
              Tester le partage
            </button>
            <button onClick={effacer}
              className="rounded-[12px] px-4 py-2.5 text-[13px] font-semibold"
              style={{ border: "1px solid #E5C9C5", background: "#fff", color: "#C1362F" }}>
              Effacer
            </button>
          </div>
        )}

        <div className="mt-8 rounded-[14px] p-4" style={{ border: "1px dashed #CDC4B0" }}>
          <p className="text-[10px] font-bold uppercase tracking-[0.14em]"
             style={{ color: "#8B8578", fontFamily: "'Roboto Mono', monospace" }}>
            Écran d'accueil
          </p>
          {installable ? (
            <button onClick={() => { installable.prompt(); setInstallable(null); }}
              className="mt-3 w-full rounded-[12px] py-3 text-[14px] font-semibold"
              style={{ background: "#1C1A17", color: "#F7F3E8" }}>
              Installer l'application
            </button>
          ) : (
            <p className="mt-2 text-[12.5px] leading-relaxed" style={{ color: "#8B8578" }}>
              <b style={{ color: "#1C1A17" }}>iPhone</b> — Safari, bouton Partager,
              « Sur l'écran d'accueil ».<br />
              <b style={{ color: "#1C1A17" }}>Android</b> — menu ⋮, « Installer ».
            </p>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Verification />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () =>
    navigator.serviceWorker.register("/sw.js").catch(() => {}));
}
</script>
</body>
</html>
